<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f1610"/>
      <stop offset="100%" stop-color="#0b0908"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8c96a"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
    <linearGradient id="ddl" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="50%" stop-color="#6b300a"/>
      <stop offset="100%" stop-color="#4e2105"/>
    </linearGradient>
    <linearGradient id="cookie" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d9b382"/>
      <stop offset="100%" stop-color="#b88b52"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg)"/>
  <circle cx="300" cy="185" r="120" fill="none" stroke="url(#gold)" stroke-opacity="0.2" stroke-width="1.5"/>
  <circle cx="300" cy="185" r="105" fill="none" stroke="url(#gold)" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="4 6"/>
  <!-- Stylized Alfajor Illustration -->
  <g transform="translate(300, 185)">
    <ellipse cx="0" cy="32" rx="78" ry="20" fill="rgba(0,0,0,0.55)"/>
    <!-- Bottom cookie -->
    <rect x="-70" y="6" width="140" height="20" rx="10" fill="url(#cookie)"/>
    <ellipse cx="0" cy="6" rx="70" ry="12" fill="#cfa46e"/>
    <!-- Dulce de leche filling -->
    <rect x="-72" y="-12" width="144" height="22" rx="11" fill="url(#ddl)"/>
    <!-- Coconut / texture dots on filling -->
    <g fill="#f5edd8" opacity="0.75">
      <circle cx="-55" cy="-1" r="2"/><circle cx="-42" cy="2" r="1.8"/><circle cx="-28" cy="-3" r="2.2"/>
      <circle cx="-14" cy="1" r="1.7"/><circle cx="0" cy="-2" r="2.1"/><circle cx="15" cy="2" r="1.9"/>
      <circle cx="30" cy="-1" r="2"/><circle cx="45" cy="1" r="1.8"/><circle cx="58" cy="-2" r="2"/>
      <circle cx="-48" cy="-6" r="1.5"/><circle cx="-20" cy="4" r="1.6"/><circle cx="8" cy="-5" r="1.7"/>
      <circle cx="24" cy="3" r="1.5"/><circle cx="50" cy="-5" r="1.6"/>
    </g>
    <!-- Top cookie -->
    <rect x="-70" y="-30" width="140" height="20" rx="10" fill="url(#cookie)"/>
    <ellipse cx="0" cy="-30" rx="70" ry="14" fill="#e2be8f"/>
    <!-- Powdered sugar / detail -->
    <ellipse cx="0" cy="-31" rx="52" ry="8" fill="#f5edd8" opacity="0.25"/>
  </g>
  <text x="300" y="345" text-anchor="middle" fill="#C9A84C" font-family="Cinzel, Georgia, serif" font-size="15" letter-spacing="4">ALFAJORES ARTESANALES</text>
</svg>
